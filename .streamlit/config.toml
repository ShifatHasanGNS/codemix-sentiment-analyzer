# shadcn/ui-inspired theme, in light + dark variants -- Streamlit shows a
# Light / Dark / "Use system setting" choice in its settings menu whenever
# both [theme.light] and [theme.dark] are defined.

[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.9rem"
# Bumped from 16 -- and every heading size scaled up by the same ~1.125x
# factor (not just the base), so the size *ratios* between title, section
# headings, and body text stay exactly as they were: bigger everywhere,
# same visual hierarchy and attention order.
baseFontSize = 18
baseFontWeight = 400
headingFontSizes = ["44px", "36px", "30px", "26px", "22px", "18px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = true
# chartCategoricalColors is only valid at the top level, not per light/dark
# mode -- shared across both (still reads fine against either background).
chartCategoricalColors = ["#2563EB", "#EF4444", "#22C55E", "#F97316", "#8B5CF6", "#EAB308", "#71717A"]

[theme.light]
# A real accent (not a neutral zinc) so "selected"/"active" states -- pills,
# the primary button, focus rings -- read unmistakably as on, not disabled.
# #2563EB gives 5.17:1 contrast with the white text Streamlit always draws
# on primaryColor, comfortably clearing WCAG AA (verified, not eyeballed).
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FAFAFA"
codeBackgroundColor = "#F4F4F5"
textColor = "#09090B"
linkColor = "#2563EB"
borderColor = "#E4E4E7"
codeTextColor = "#18181B"
grayColor = "#71717A"
blueColor = "#2563EB"
greenColor = "#22C55E"
redColor = "#EF4444"
yellowColor = "#EAB308"
orangeColor = "#F97316"
violetColor = "#8B5CF6"
# Explicit badge tint variants (rather than relying on auto-derivation)
# to guarantee readable contrast for the sentiment badges.
greenBackgroundColor = "#DCFCE7"
greenTextColor = "#15803D"
redBackgroundColor = "#FEE2E2"
redTextColor = "#B91C1C"
grayBackgroundColor = "#F4F4F5"
grayTextColor = "#3F3F46"
dataframeBorderColor = "#E4E4E7"
dataframeHeaderBackgroundColor = "#FAFAFA"

[theme.dark]
# Same accent blue as light mode (not a neutral zinc, and not near-white --
# that shipped in an earlier pass and made both the Analyze button's text
# invisible AND selected pills look indistinguishable from disabled ones).
# One consistent blue across both themes is the most intuitive: it always
# means "active/interactive," never anything else.
primaryColor = "#2563EB"
backgroundColor = "#09090B"
secondaryBackgroundColor = "#18181B"
codeBackgroundColor = "#18181B"
textColor = "#FAFAFA"
linkColor = "#60A5FA"
borderColor = "#27272A"
codeTextColor = "#E4E4E7"
grayColor = "#A1A1AA"
blueColor = "#60A5FA"
greenColor = "#4ADE80"
redColor = "#F87171"
yellowColor = "#FACC15"
orangeColor = "#FB923C"
violetColor = "#A78BFA"
greenBackgroundColor = "#052E16"
greenTextColor = "#4ADE80"
redBackgroundColor = "#450A0A"
redTextColor = "#F87171"
grayBackgroundColor = "#27272A"
grayTextColor = "#D4D4D8"
dataframeBorderColor = "#27272A"
dataframeHeaderBackgroundColor = "#18181B"

[theme.light.sidebar]
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F4F4F5"
codeBackgroundColor = "#E4E4E7"
textColor = "#09090B"
borderColor = "#E4E4E7"
# Same blue as the main content's primaryColor -- this is specifically
# what selected model pills use, so it needs to read as clearly "active."
primaryColor = "#2563EB"
dataframeHeaderBackgroundColor = "#F4F4F5"
dataframeBorderColor = "#E4E4E7"

[theme.dark.sidebar]
backgroundColor = "#18181B"
secondaryBackgroundColor = "#27272A"
codeBackgroundColor = "#27272A"
textColor = "#FAFAFA"
borderColor = "#27272A"
primaryColor = "#2563EB"
dataframeHeaderBackgroundColor = "#27272A"
dataframeBorderColor = "#3F3F46"
